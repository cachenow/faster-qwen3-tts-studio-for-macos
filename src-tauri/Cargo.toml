[package]
name = "faster-qwen3-tts-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
resolver = "3"

[build-dependencies]
tauri-build = "=2.5.1"
tauri-codegen = "=2.5.0"

[dependencies]
tauri = "=2.9.1"
# Keep Tauri's internal crates in the same release family.
tauri-macros = "=2.5.0"
tauri-runtime = "=2.9.1"
tauri-runtime-wry = "=2.9.1"
tauri-utils = "=2.8.0"
tauri-plugin-single-instance = "=2.3.5"
libc = "0.2"
