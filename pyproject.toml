[project]
name = "faster-qwen3-tts-studio"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "certifi>=2025.4.26",
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "python-multipart==0.0.22",
]

[project.optional-dependencies]
metal = [
  "faster-qwen3-tts==0.5.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "qwentts-cpp-python==0.5.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
build-constraint-dependencies = ["setuptools==80.9.0", "wheel==0.45.1"]
